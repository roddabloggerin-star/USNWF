name: Weather Bot

on:
  schedule:
    # Run every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch:  # Allow manual triggering

jobs:
  run-weather-bot:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run weather bot
      env:
        NWS_API_KEY: ${{ secrets.NWS_API_KEY }}
        NWS_USER_AGENT: ${{ secrets.NWS_USER_AGENT }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        BLOGGER_API_KEY: ${{ secrets.BLOGGER_API_KEY }}
        BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
        PUBLISH_TO_BLOGGER: ${{ secrets.PUBLISH_TO_BLOGGER }}
        CANONICAL_URL: ${{ secrets.CANONICAL_URL }}
      run: |
        python src/main.py
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: blog-posts
        path: blog_posts/
        retention-days: 30